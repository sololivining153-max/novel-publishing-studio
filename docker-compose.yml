services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: novel_forge
      POSTGRES_USER: novel_forge
      POSTGRES_PASSWORD: change_me
    volumes:
      - novel_forge_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novel_forge -d novel_forge"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  novel_forge_data:
